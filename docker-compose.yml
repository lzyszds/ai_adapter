# LLM-Shield 服务器一键部署
# 用法：docker compose up -d
# 自动更新：docker compose -f docker-compose.watchtower.yml up -d（只需部署一次，见该文件）
# 改密码/上游：直接编辑下面 environment（MySQL 密码与 DATABASE_URL 保持一致）

services:
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.0
    container_name: ai_adapter-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: LlmShield2026
      MYSQL_DATABASE: llm_shield
      MYSQL_USER: llm_shield
      MYSQL_PASSWORD: LlmShield2026
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      # 与 app 相同账号，走 TCP（127.0.0.1），避免 localhost 套接字误报 healthy
      test: ["CMD", "mysql", "-ullm_shield", "-pLlmShield2026", "-h127.0.0.1", "-e", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    container_name: ai_adapter-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    image: registry.cn-hangzhou.aliyuncs.com/lzyszds/ai_adapter:latest
    pull_policy: if_not_present
    container_name: ai_adapter-app
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    ports:
      - "8088:80"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: mysql://llm_shield:LlmShield2026@mysql:3306/llm_shield?connection_limit=20
      REDIS_URL: redis://redis:6379
      UPSTREAM_URL: https://llm.goaichat.top
      UPSTREAM_API_KEY: ""
      PROXY_API_KEY: ""
      FLUSH_INTERVAL_MS: "5000"
      FLUSH_BATCH_SIZE: "500"
      STATS_CACHE_TTL_MS: "10000"
      STREAM_IDLE_TIMEOUT_MS: "120000"
      LOG_LEVEL: info
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1/health').then(async r => { const j = await r.json(); process.exit(r.ok && j.status === 'ok' ? 0 : 1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  mysql-data:
  redis-data:

networks:
  internal:
    driver: bridge
